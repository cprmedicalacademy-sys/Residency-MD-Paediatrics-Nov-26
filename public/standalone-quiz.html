            if (ans === q.correctOption) sbaCorrect++;
            else sbaWrong++;
          }
        }
      });

      // Step 1: MCQ (True/False) Calculation: Total Correct MCQs minus Wrong MCQs. Then multiply the result by 0.2.
      const mcqIntermediate = Number(((mcqCorrect - mcqWrong) * 0.2).toFixed(2));
      // Step 2: Adding SBA Score: Add the correct SBA score to intermediate result.
      const withSBA = Number((mcqIntermediate + sbaCorrect).toFixed(2));
      // Step 3: Negative Marking Deduction: Subtract (Wrong MCQ count * 0.05) from the total.
      const negativeDeduction = Number((mcqWrong * 0.05).toFixed(2));
      // Final Result:
      const finalScore = Number((withSBA - negativeDeduction).toFixed(2));
      const percentage = Number(Math.max(0, (finalScore / 40.0) * 100).toFixed(1));

      return {
        mcqCorrect,
        mcqWrong,
        sbaCorrect,
        sbaWrong,
        mcqIntermediate,
        negativeDeduction,
        finalScore,
        maxScore: 40.0,
        percentage
      };
    }

    function saveScoreToLeaderboard(res) {
      const stored = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
      const newEntry = {
        name: candidateName,
        finalScore: res.finalScore,
        percentage: res.percentage,
        mcqCorrect: res.mcqCorrect,
        mcqWrong: res.mcqWrong,
        sbaCorrect: res.sbaCorrect,
        date: new Date().toLocaleDateString()
      };
      stored.push(newEntry);
      stored.sort((a,b) => b.finalScore - a.finalScore);
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(stored));
    }

    // Render Logic
    function render() {
      const container = document.getElementById('mainContainer');
      if (currentTab === 'quiz') {
        const q = QUESTIONS[currentIdx];
        container.innerHTML = `
          <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200">
              <div>
                <span class="text-xs font-bold text-teal-800 uppercase">Question ${currentIdx + 1} of ${QUESTIONS.length}</span>
                <h2 class="text-base sm:text-lg font-bold text-slate-900">${q.stem}</h2>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="toggleMode()" class="px-3 py-1.5 rounded-lg border text-xs font-bold ${examMode === 'practice' ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-slate-50 text-slate-700'}">
                  ${examMode === 'practice' ? '★ Practice Mode' : '⏱ Exam Mode'}
                </button>
                <button onclick="submitQuiz()" class="px-4 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs">
                  Submit & Grade
                </button>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-3">
              ${q.type === 'mcq' ? q.options.map(opt => {
                const choice = userAnswers[q.id] && userAnswers[q.id][opt.id];
                return `
                  <div class="flex items-center justify-between p-3 rounded-xl border ${choice !== undefined ? 'bg-teal-50/50 border-teal-300' : 'bg-slate-50 border-slate-200'}">
                    <span class="text-sm font-medium"><strong class="font-mono mr-2">${opt.id}.</strong>${opt.text}</span>
                    <div class="flex gap-2">
                      <button onclick="chooseMCQ(${q.id}, '${opt.id}', true)" class="px-3 py-1 rounded-md text-xs font-bold ${choice === true ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-700'}">True</button>
                      <button onclick="chooseMCQ(${q.id}, '${opt.id}', false)" class="px-3 py-1 rounded-md text-xs font-bold ${choice === false ? 'bg-rose-600 text-white' : 'bg-white border text-slate-700'}">False</button>
                    </div>
                  </div>
                `;
              }).join('') : q.options.map(opt => {
                const choice = userAnswers[q.id];
                return `
                  <button onclick="chooseSBA(${q.id}, '${opt.id}')" class="w-full text-left p-3.5 rounded-xl border flex items-center gap-3 ${choice === opt.id ? 'bg-teal-50 border-teal-500 font-bold' : 'bg-white border-slate-200'}">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${choice === opt.id ? 'bg-teal-600 text-white' : 'bg-slate-100'}">${opt.id}</span>
                    <span class="text-sm">${opt.text}</span>
                  </button>
                `;
              }).join('')}

              ${examMode === 'practice' && q.explanation ? `
                <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 mt-4">
                  <strong>Clinical Note:</strong> ${q.explanation}
                </div>
              ` : ''}
            </div>

            <div class="flex justify-between items-center">
              <button onclick="prevQ()" ${currentIdx === 0 ? 'disabled' : ''} class="px-4 py-2 border rounded-xl text-xs font-semibold disabled:opacity-40">Previous</button>
              <span class="text-xs font-mono text-slate-500">${currentIdx + 1} / ${QUESTIONS.length}</span>
              <button onclick="nextQ()" ${currentIdx === QUESTIONS.length - 1 ? 'disabled' : ''} class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold disabled:opacity-40">Next Question</button>
            </div>
          </div>
        `;
      } else if (currentTab === 'dashboard') {
        const lastResult = calculateExactResult();
        container.innerHTML = `
          <div class="space-y-6 max-w-3xl mx-auto">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
              <h2 class="text-xl font-bold text-slate-900">Candidate Dashboard & Entry</h2>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">CANDIDATE NAME / ID</label>
                <div class="flex gap-2">
                  <input id="candNameInput" type="text" value="${candidateName}" class="flex-1 px-3 py-2 border rounded-xl text-sm font-semibold" />
                  <button onclick="saveName()" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold">Save</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3 pt-3">
                <button onclick="startMode('exam')" class="p-4 bg-teal-50 border border-teal-200 rounded-xl text-left hover:border-teal-400">
                  <span class="block font-bold text-sm text-teal-900">⏱ Exam Mode</span>
                  <span class="text-xs text-teal-700">Official formula with timer</span>
                </button>
                <button onclick="startMode('practice')" class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-left hover:border-amber-400">
                  <span class="block font-bold text-sm text-amber-900">★ Practice Mode</span>
                  <span class="text-xs text-amber-700">Instant answer checking</span>
                </button>
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'leaderboard') {
        const list = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
        container.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex justify-between items-center">
              <h2 class="text-2xl font-bold text-slate-900">Official Merit Leaderboard</h2>
              <button onclick="currentTab='quiz'; render();" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold">Take Test</button>
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
              <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 border-b text-xs font-bold text-slate-500 uppercase">
                  <tr>
                    <th class="p-3 text-center">Rank</th>
                    <th class="p-3">Candidate</th>
                    <th class="p-3 text-center">Final Score</th>
                    <th class="p-3 text-center">MCQ (Correct/Wrong)</th>
                    <th class="p-3 text-center">SBA</th>
                  </tr>
                </thead>
                <tbody class="divide-y">
                  ${list.length > 0 ? list.map((item, idx) => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 text-center font-bold font-mono">#${idx + 1}</td>
                      <td class="p-3 font-semibold text-slate-900">${item.name}</td>
                      <td class="p-3 text-center font-bold text-teal-800 font-mono">${item.finalScore.toFixed(2)} / 40.0</td>
                      <td class="p-3 text-center font-mono text-xs">${item.mcqCorrect}✓ / ${item.mcqWrong}✗</td>
                      <td class="p-3 text-center font-mono text-xs">${item.sbaCorrect}/5</td>
                    </tr>
                  `).join('') : '<tr><td colspan="5" class="p-6 text-center text-slate-500">No submissions recorded yet. Complete an exam to view leaderboard!</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    window.chooseMCQ = (qId, stemId, val) => {
      userAnswers[qId] = userAnswers[qId] || {};
      userAnswers[qId][stemId] = val;
      render();
    };

    window.chooseSBA = (qId, optId) => {
      userAnswers[qId] = optId;
      render();
    };

    window.prevQ = () => { if (currentIdx > 0) { currentIdx--; render(); } };
    window.nextQ = () => { if (currentIdx < QUESTIONS.length - 1) { currentIdx++; render(); } };
    window.toggleMode = () => { examMode = examMode === 'exam' ? 'practice' : 'exam'; render(); };
    window.startMode = (m) => { examMode = m; currentTab = 'quiz'; currentIdx = 0; render(); };
    window.saveName = () => {
      const val = document.getElementById('candNameInput').value.trim();
      if (val) { candidateName = val; localStorage.setItem(USER_KEY, val); alert('Name saved!'); render(); }
    };

    window.submitQuiz = () => {
      const res = calculateExactResult();
      saveScoreToLeaderboard(res);

      const shareText = `🎯 I scored ${res.finalScore.toFixed(2)}/40.0 (${res.percentage}%) in CPR Medical Academy Residency MD Paediatrics Exam! Formula: [(Correct-Wrong)*0.2] + SBA - (Wrong*0.05).`;
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      const twUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
      const fbUrl = `https://www.facebook.com/sharer/sharer.php?quote=${encodeURIComponent(shareText)}`;

      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4 z-50";
      modal.innerHTML = `
        <div class="bg-white rounded-3xl p-6 max-w-lg w-full space-y-5 shadow-2xl animate-in fade-in">
          <div class="text-center space-y-1">
            <h3 class="text-xs font-bold uppercase tracking-widest text-teal-700">RESIDENCY MD PAEDIATRICS RESULT</h3>
            <h2 class="text-3xl font-black text-slate-900 font-mono">${res.finalScore.toFixed(2)} / 40.0 Marks</h2>
            <p class="text-xs text-slate-500 font-medium">${candidateName} · Accuracy: ${res.percentage}%</p>
          </div>

          <div class="bg-slate-50 p-4 rounded-2xl border text-xs font-mono space-y-2">
            <div class="font-bold text-slate-800 text-[11px] uppercase tracking-wider pb-1 border-b">Exact Formula Calculation:</div>
            <div class="flex justify-between"><span>1. MCQ Score [(${res.mcqCorrect}-${res.mcqWrong})×0.2]:</span><strong class="text-teal-800">${res.mcqIntermediate.toFixed(2)}</strong></div>
            <div class="flex justify-between"><span>2. SBA Score (+${res.sbaCorrect} of 5):</span><strong class="text-emerald-700">+${res.sbaCorrect.toFixed(2)}</strong></div>
            <div class="flex justify-between"><span>3. Negative Marking [${res.mcqWrong}×0.05]:</span><strong class="text-rose-600">-${res.negativeDeduction.toFixed(2)}</strong></div>
            <div class="flex justify-between pt-1 border-t text-sm font-bold"><span>Final Result:</span><span class="text-teal-900">${res.finalScore.toFixed(2)} / 40.0</span></div>
          </div>

          <div class="space-y-2">
            <span class="text-xs font-bold uppercase text-slate-500 block">One-Click Social Sharing:</span>
            <div class="grid grid-cols-3 gap-2">
              <a href="${waUrl}" target="_blank" class="py-2 px-3 rounded-xl bg-emerald-100 text-emerald-800 text-center font-bold text-xs">WhatsApp</a>
              <a href="${fbUrl}" target="_blank" class="py-2 px-3 rounded-xl bg-blue-100 text-blue-800 text-center font-bold text-xs">Facebook</a>
              <a href="${twUrl}" target="_blank" class="py-2 px-3 rounded-xl bg-slate-900 text-white text-center font-bold text-xs">X / Twitter</a>
            </div>
            <button onclick="navigator.clipboard.writeText('${shareText}'); alert('Result copied to clipboard!');" class="w-full py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-800">
              Copy Result Text to Clipboard
            </button>
          </div>

          <button onclick="this.closest('.fixed').remove(); currentTab='leaderboard'; render();" class="w-full py-2.5 bg-teal-600 text-white rounded-xl font-bold text-xs shadow-sm">
            View Leaderboard & Standings
          </button>
        </div>
      `;
      document.body.appendChild(modal);
    };

    document.getElementById('navQuizBtn').onclick = () => { currentTab = 'quiz'; render(); };
    document.getElementById('navDashBtn').onclick = () => { currentTab = 'dashboard'; render(); };
    document.getElementById('navLeadBtn').onclick = () => { currentTab = 'leaderboard'; render(); };

    render();
  </script>
</body>
</html>
